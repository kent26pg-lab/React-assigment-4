<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      const base = "/React-assigment-4/";

      const route = path.startsWith(base)
        ? path.substring(base.length)
        : path;

      const redirectUrl =
        base +
        "?redirect=" +
        encodeURIComponent(
          "/" + route + search + hash
        );

      window.location.replace(redirectUrl);
    </script>
  </head>

  <body></body>
</html>
