<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />

    <script>
      const base = "/React-assigment-4";

      const path =
        window.location.pathname.replace(base, "");

      const redirect =
        base +
        "/?redirect=" +
        encodeURIComponent(path + window.location.search);

      window.location.replace(redirect);
    </script>
  </head>

  <body></body>
</html>
